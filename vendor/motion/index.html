# Motion appifact — shared type

This page is the Motion PLAYER only: index.html + artifact-type/app.js +
artifact-type/app.css (+ artifact-type/reference/*.md, the authoring
method, and artifact-type/thumbnail/thumbnail.json, the gallery thumbnail
declaration) are one published release of the Motion type, shared by every
film made from it. Nothing about any particular film is in these files —
not even its title. A film is a short timeline video composed from the
user's own images, fonts and UI code; the same page, opened from file://
with #tools, is the headless renderer for stills.

## Where a film's data lives

In the film's own live store (the db capability), never in a file:
film/meta {v, title, updatedAt}; one assets/<file> {ref, mime, w, h} per
image or font (ref = the film's own /_blob/<id> upload or a small data:
URI); one modules/<file> {kind, text} per CSS/HTML/data module (a module
split as file~1…file~n is joined on read); film/script {code} — the cut,
a JavaScript program that sets window.CUT {width, height, fps, duration,
chapters, init(kit), render(t, kit), score(S, kit)} with render a pure
function of t. Claude writes the documents (meta first, script last) and
revises them with the ArtifactData tool; nobody edits a film in the page. The
player composes the records on load and on every delivery, resolves
asset refs to bytes, and reloads the sandboxed runner when the script or
modules change, re-seeking to the current time. An empty store is "No
animation yet", which is what this type's own page shows. Comments are
Frame's: the page names each pin's time and position (or its time span)
in its anchor (animation-v1) and places pins near the playhead or on the
timeline; it never sees their text.

## Trust

The cut and js modules are cross-user code, and they are the film's own
code: like Design's artboards they run in a nested iframe ON THE ARTIFACT
PAGE'S ORIGIN (`sandbox="allow-scripts allow-same-origin"`), so a clip or
image streams from the artifact's `_blob/<id>` and film code runs as the
viewer — it can reach this page's realm (the film's store, writable only in
a session that may edit it; asset upload; the send-to-Claude verb;
downloads; this origin's storage) and is bounded by what the artifact page
itself may do under Frame's CSP and origin, not by the frame. The frame's
own CSP (nothing but `'self'`, `data:` and `blob:` images, media and fetches,
`'self'`/`data:` fonts; no workers, frames or forms) and sandbox flags (no modals, popups, top
navigation) are hygiene for code that stays inside it. The frame receives
no pointer or keyboard input (a host overlay owns the pointer); the host
pins the message source and accepts only the film protocol's shapes;
frames come back as SVG text that is only ever loaded as an <img> in a
second, opaque-origin document, errors as text, nothing is inserted as
HTML host-side. Record-derived strings render as React text. The type's
`db` rules keep store writes to sessions that can edit.
